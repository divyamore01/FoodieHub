<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodieHub - Checkout</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <nav class="navbar">
        <h1 class="logo">FoodieHub 🍔</h1>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="menu.html">Menu</a></li>
            <li><a href="cart.html">Cart 🛒</a></li>
        </ul>
    </nav>
</header>

<main>

    <section class="menu-section">
        <h2>Checkout</h2>
        <p>Enter your details to place your order.</p>

        <div class="category-card">

            <h3>Customer Details</h3>

            <form onsubmit="placeOrder(event)">

                <p>
                    <label>Name:</label><br>
                    <input type="text" id="name" required>
                </p>

                <p>
                    <label>Phone Number:</label><br>
                    <input type="tel" id="phone" required>
                </p>

                <p>
                    <label>Delivery Address:</label><br>
                    <textarea id="address" rows="4" required></textarea>
                </p>

                <h3 id="checkout-total">Total: ₹0</h3>

                <button type="submit" class="btn">Place Order</button>

            </form>

        </div>
    </section>

</main>

<footer>
    <p>© 2026 FoodieHub | Online Food Ordering System</p>
</footer>

<script>
function loadTotal() {

    let cart = JSON.parse(localStorage.getItem("foodieCart")) || [];

    let total = 0;

    cart.forEach(item => {
        total += item.price * item.quantity;
    });

    document.getElementById("checkout-total").innerText =
        "Total: ₹" + total;
}

function placeOrder(event) {

    event.preventDefault();

    let name = document.getElementById("name").value;

    alert("Thank you " + name + "! Your order has been placed successfully.");

    localStorage.removeItem("foodieCart");

    window.location.href = "index.html";
}

loadTotal();
</script>

</body>
</html>
